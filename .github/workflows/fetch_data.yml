name: Fetch Nivus Sensor Data

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours (00, 06, 12, 18 UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-data:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev libsqlite3-dev libnetcdf-dev

      - name: Install dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e '
            pkgs <- c("httr", "jsonlite", "lubridate", "dplyr", "purrr", "tidyr",
                       "ggplot2", "fs", "readr", "knitr", "openxlsx", "rdwd",
                       "terra", "stars", "leaflet", "htmlwidgets", "htmltools",
                       "plotly", "leafpop", "remotes", "zoo")
            install.packages(pkgs)
            failed <- pkgs[!sapply(pkgs, requireNamespace, quietly = TRUE)]
            if (length(failed) > 0) stop("Failed to install: ", paste(failed, collapse = ", "))
          '
          Rscript -e 'remotes::install_github("brry/dwdradar", quiet = TRUE)'

      - name: Fetch weather forecast
        run: Rscript scripts/api/fetch_forecast.R

      - name: Check for Rain Mode or Daily Sync
        id: check_rain
        run: |
          HOUR=$(date +%H)
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_dispatch" ] || ([ "$HOUR" -ge "05" ] && [ "$HOUR" -le "09" ]); then
            echo "sync_reason=Daily Full Sync Window or Manual Trigger" >> $GITHUB_OUTPUT
            echo "should_continue=true" >> $GITHUB_OUTPUT
            echo "is_daily_sync=true" >> $GITHUB_OUTPUT
          else
            RAIN_COUNT=$(tail -n +2 data/processed/weather_forecast.csv | cut -d',' -f3 | grep -v "^0$" | grep -c "." || true)
            if [ "$RAIN_COUNT" -gt 0 ]; then
              echo "sync_reason=Rain Forecast Detected ($RAIN_COUNT hours)" >> $GITHUB_OUTPUT
              echo "should_continue=true" >> $GITHUB_OUTPUT
              echo "is_daily_sync=false" >> $GITHUB_OUTPUT
            else
              echo "sync_reason=No rain and not daily sync" >> $GITHUB_OUTPUT
              echo "should_continue=false" >> $GITHUB_OUTPUT
              echo "is_daily_sync=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Fetch sensor data (Nivus)
        if: steps.check_rain.outputs.should_continue == 'true'
        env:
          NIVUS_API_KEY: ${{ secrets.NIVUS_API_KEY }}
        run: Rscript scripts/api/fetch_nivus.R

      - name: Fetch RADOLAN precipitation
        if: steps.check_rain.outputs.should_continue == 'true'
        run: Rscript scripts/api/fetch_radolan.R

      - name: Clean and analyze data
        if: steps.check_rain.outputs.should_continue == 'true'
        run: Rscript scripts/analysis/level_analysis.R

      - name: Generate plots
        if: steps.check_rain.outputs.should_continue == 'true'
        run: Rscript scripts/visualization/plot_sensors.R

      - name: Generate interactive sensor map
        if: steps.check_rain.outputs.should_continue == 'true'
        run: Rscript scripts/visualization/generate_interactive_map.R

      - name: Generate full timeseries plots
        if: steps.check_rain.outputs.should_continue == 'true'
        run: Rscript scripts/visualization/plot_full_timeseries.R

      # Event detection läuft immer (auch ohne Regenvorhersage),
      # damit unvorhergesehene Ereignisse nicht verloren gehen.
      - name: Detect events
        run: Rscript scripts/analysis/event_detection.R

      - name: Correlate events with precipitation
        run: Rscript scripts/analysis/correlate_events.R

      - name: Generate event plots
        run: Rscript scripts/visualization/plot_events.R

      - name: Lag analysis
        if: steps.check_rain.outputs.should_continue == 'true'
        run: Rscript scripts/analysis/lag_analysis.R

      # Retrospektive Analyse nur im täglichen Sync-Fenster (05-09 UTC):
      # Holt Open-Meteo-Archivdaten für alle historischen Events und aktualisiert
      # historical_verified_events.csv, all_detected_events.xlsx und events_summary_table.md.
      - name: Retrospective event analysis (daily sync only)
        if: steps.check_rain.outputs.is_daily_sync == 'true'
        run: Rscript scripts/analysis/retrospective_event_analysis.R

      - name: Check sensor health
        run: Rscript scripts/analysis/check_sensor_health.R

      - name: Check risk level
        run: Rscript scripts/analysis/check_risk.R

      - name: Update README
        run: Rscript scripts/automation/update_readme.R

      - name: Sync map to GitHub Pages
        run: |
          cp data/output/sensor_map.html docs/sensor_map.html 2>/dev/null || true
          if [ -d "data/output/sensor_map_files" ]; then
            cp -r data/output/sensor_map_files docs/sensor_map_files 2>/dev/null || true
          fi
          if [ -d "data/output/graphs" ]; then
            mkdir -p docs/graphs
            cp data/output/graphs/*.html docs/graphs/ 2>/dev/null || true
            if [ -d "data/output/graphs/lib" ]; then
              cp -r data/output/graphs/lib docs/graphs/ 2>/dev/null || true
            fi
          fi
          if [ -d "data/output/event_plots" ]; then
            rm -rf docs/event_plots
            mkdir -p docs/event_plots
            cp data/output/event_plots/*.html docs/event_plots/ 2>/dev/null || true
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git lfs install
          git add data/raw/sensor_exports/*.csv || true
          git add data/processed/cleaned_analysis/*.csv || true
          git add data/output/plots/*.png || true
          git add data/processed/detected_events.csv || true
          git add data/processed/detected_events.md || true
          git add data/processed/retrospective_events.csv || true
          git add data/processed/retrospective_events.md || true
          git add data/processed/events_by_station/*.csv || true
          git add data/processed/events_by_station/*.md || true
          git add data/processed/weather_forecast.csv || true
          git add data/processed/precipitation_at_sensors.csv || true
          git add data/processed/precipitation_hourly_at_sensors.csv || true
          git add data/processed/lag_analysis.csv || true
          git add data/processed/lag_report.md || true
          git add data/output/plots/lag_*.png || true
          git add data/output/sensor_map.html || true
          git add data/output/graphs/*.html || true
          git add data/output/graphs/lib/ || true
          git add data/output/event_plots/*.html || true
          git add data/output/all_detected_events.xlsx || true
          git add data/output/events_summary_table.md || true
          if [ -d "data/metadata" ]; then
            git add data/metadata/*.csv || true
            git add data/metadata/*.md || true
          fi
          git add README.md || true
          git add docs/ || true
          git commit -m "Auto-update sensor data, events, risk analysis and dashboard [skip ci]" || echo "No changes to commit"
          # Rebase auf Remote falls in der Zwischenzeit ein PR gemerged wurde.
          # Bei Konflikten in generierten Dateien (HTML-Plots, PNGs, CSVs)
          # behalten wir unsere frisch erzeugten Versionen.
          git pull --rebase --autostash origin main || {
            echo "Rebase conflict detected — keeping our freshly generated files..."
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --theirs "$f" 2>/dev/null || git checkout --ours "$f" 2>/dev/null || true
              git add "$f"
            done
            GIT_EDITOR=true git rebase --continue || true
          }
          git push
