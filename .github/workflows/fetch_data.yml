name: Fetch Nivus Sensor Data

on:
  schedule:
    - cron: '0 8 * * *' # Run at 08:00 UTC every day
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "lubridate", "dplyr", "purrr", "tidyr", "ggplot2", "fs", "readr"))'

      - name: Fetch data
        env:
          NIVUS_API_KEY: ${{ secrets.NIVUS_API_KEY }}
        run: Rscript scripts/fetch_nivus_rest.R

      - name: Clean and analyze data
        run: Rscript scripts/test_scripts/sensor_level_analysis.R

      - name: Generate plots
        run: Rscript scripts/test_scripts/plot_sensor_data.R

      - name: Detect events
        run: Rscript scripts/test_scripts/event_detection.R

      - name: Send Email Notification
        if: hashFiles('data/latest_notifications.csv') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Nivus Sensor Update: Flooding Event(s) Detected!"
          to: ${{ secrets.DESTINATION_EMAIL }}
          from: "Nivus Automation <automation@nivus.com>"
          body: |
            Hello,

            The automated analysis has detected new flooding events in the last 24 hours.
            Please check the repository for details, plots and the updated events log.

            Repository Link: https://github.com/${{ github.repository }}

            Latest Event Summary:
            $(cat data/latest_notifications.csv)
          attachments: data/plots/*.png

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/sensor_exports/*.csv
          git add data/cleaned_analysis/*.csv
          git add data/plots/*.png
          git add data/detected_events.csv
          git commit -m "Auto-update sensor data, analysis, plots and events [skip ci]" || echo "No changes to commit"
          git push
