name: Fetch Nivus Sensor Data

on:
  schedule:
    - cron: '0 8 * * *' # Run at 08:00 UTC every day
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "lubridate", "dplyr", "purrr", "tidyr", "ggplot2", "fs", "readr", "knitr", "leaflet", "htmlwidgets", "rdwd", "terra", "stars"))'

      - name: Fetch data
        env:
          NIVUS_API_KEY: ${{ secrets.NIVUS_API_KEY }}
        run: Rscript scripts/api/fetch_nivus.R

      - name: Fetch RADOLAN precipitation
        run: Rscript scripts/api/fetch_radolan.R

      - name: Fetch weather forecast
        run: Rscript scripts/api/fetch_forecast.R

      - name: Clean and analyze data
        run: Rscript scripts/analysis/level_analysis.R

      - name: Generate plots
        run: Rscript scripts/visualization/plot_sensors.R

      - name: Detect events
        run: Rscript scripts/analysis/event_detection.R

      - name: Correlate events with precipitation
        run: Rscript scripts/analysis/correlate_events.R

      - name: Update README with latest events
        run: Rscript scripts/automation/update_readme.R

      - name: Generate interactive sensor map
        run: Rscript scripts/visualization/generate_interactive_map.R

      - name: Check for upcoming risks
        run: Rscript scripts/analysis/check_risk.R

      - name: Send Risk Alert Email
        if: hashFiles('data/processed/risk_report.md') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ SCIU RISK ALERT: Starkregen vorhergesagt!"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "SCIU Dashboard <${{ secrets.MAIL_USERNAME }}>"
          body: file://data/processed/risk_report.md
          convert_markdown: true

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/raw/sensor_exports/*.csv
          git add data/processed/cleaned_analysis/*.csv
          git add data/output/plots/*.png
          git add data/processed/detected_events.csv
          git add data/processed/detected_events.md
          git add data/output/sensor_map.html
          git add data/processed/weather_forecast.csv
          git add data/processed/precipitation_at_sensors.csv
          git add data/processed/event_correlation_summary.csv
          git add data/metadata/historical_verified_events.csv
          git add README.md
          git commit -m "Auto-update sensor data, precipitation, risk analysis, and dashboard [skip ci]" || echo "No changes to commit"

          git push
