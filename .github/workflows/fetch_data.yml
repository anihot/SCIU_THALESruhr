name: Fetch Nivus Sensor Data

on:
  schedule:
    - cron: '0 8 * * *' # Run at 08:00 UTC every day
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "lubridate", "dplyr", "purrr", "tidyr", "ggplot2", "fs", "readr", "knitr", "leaflet", "htmlwidgets", "rdwd", "terra", "stars"))'

      - name: Fetch data
        env:
          NIVUS_API_KEY: ${{ secrets.NIVUS_API_KEY }}
        run: Rscript scripts/fetch_nivus_rest.R

      - name: Fetch RADOLAN precipitation
        run: Rscript scripts/test_scripts/fetch_radolan.R

      - name: Clean and analyze data
        run: Rscript scripts/test_scripts/sensor_level_analysis.R

      - name: Generate plots
        run: Rscript scripts/test_scripts/plot_sensor_data.R

      - name: Detect events
        run: Rscript scripts/test_scripts/event_detection.R

      - name: Correlate events with precipitation
        run: Rscript scripts/test_scripts/correlate_events.R

      - name: Update README with latest events
        run: Rscript scripts/test_scripts/update_readme.R

      - name: Generate interactive sensor map
        run: Rscript scripts/test_scripts/generate_sensor_map.R

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/sensor_exports/*.csv
          git add data/cleaned_analysis/*.csv
          git add data/plots/*.png
          git add data/detected_events.csv
          git add data/detected_events.md
          git add data/sensor_map.html
          git add data/precipitation_at_sensors.csv
          git add data/event_correlation_summary.csv
          git add README.md
          git commit -m "Auto-update sensor data, precipitation, and analysis [skip ci]" || echo "No changes to commit"

          git push
